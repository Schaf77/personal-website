services:
  onderka-site:
    image: nginx:stable-alpine
    restart: unless-stopped
    volumes:
      - type: bind
        source: ./public
        target: /usr/share/nginx/html
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./deploy/nginx.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
        bind:
          create_host_path: false
    networks:
      - proxy

networks:
  proxy:
    external: true
    name: ${NPM_NETWORK:-proxy}
