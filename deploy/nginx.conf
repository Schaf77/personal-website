server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    autoindex off;

    # Keep directory redirects relative so NPM's HTTPS connection is preserved.
    absolute_redirect off;

    location / {
        try_files $uri $uri/ =404;
    }

    # Both direct WKD and advanced WKD (with an email-domain path component).
    location ~ ^/\.well-known/openpgpkey/(?:[^/]+/)?policy$ {
        default_type text/plain;
        add_header Access-Control-Allow-Origin "*" always;
        try_files $uri =404;
    }

    location ~ ^/\.well-known/openpgpkey/(?:[^/]+/)?hu/ {
        types {}
        default_type application/octet-stream;
        add_header Access-Control-Allow-Origin "*" always;
        try_files $uri =404;
    }

    location ~ ^/keys/.*\.asc$ {
        types {}
        default_type text/plain;
        try_files $uri =404;
    }
}
